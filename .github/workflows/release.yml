# Code Changes
name: Publish Electron Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./sysmod-studio

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './sysmod-studio/package-lock.json'

      # JKind's Gradle 7.2 build only runs on JDK 11. The same JDK makes the bundled runtime,
      # so students never install Java.
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Dependencies
        run: npm ci

      # The installer version comes from package.json, so match it to the tag (v1.2.3 -> 1.2.3)
      - name: Set Version From Tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Compile JKind and bundle a Java runtime
        run: npm run build:jkind -- --rebuild

      - name: Prove the FRC standard contracts
        run: npm run test:proofs

      - name: Build the app
        run: npx electron-vite build

      - name: Build and Publish Electron App
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
