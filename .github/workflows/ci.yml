name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-prove:
    name: Build and prove (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The bundled Java runtime is platform specific, so prove on each OS we ship
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./sysmod-studio

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './sysmod-studio/package-lock.json'

      # JKind's Gradle 7.2 build only runs on JDK 11. The same JDK makes the bundled runtime,
      # so students never install Java.
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Dependencies
        run: npm ci

      - name: Check the hardware validation engine
        run: npm run test:hardware

      # Real Soar 9.6.5 checks that every generated behavior rule loads. Its CLI ships for Linux,
      # so the Windows job checks the generator without it.
      - name: Download Soar 9.6.5
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/soar.zip" https://github.com/SoarGroup/Soar/releases/download/releases/9.6.5/SoarSuite_9.6.5-Multiplatform.zip
          unzip -q "$RUNNER_TEMP/soar.zip" -d "$RUNNER_TEMP/soar"
          SUITE="$(dirname "$(find "$RUNNER_TEMP/soar" -name setup.sh -type f | head -n 1)")"
          if [ ! -f "$SUITE/setup.sh" ]; then echo "::error::setup.sh not found in the Soar zip"; exit 1; fi
          # The zip keeps each platform's binaries in bin/<platform>/; setup.sh moves the Linux ones into bin/
          bash "$SUITE/setup.sh"
          chmod +x "$SUITE/bin/soar"
          echo "SOAR_HOME=$SUITE/bin" >> "$GITHUB_ENV"

      # On Linux this also runs the conformance tests: the behavior simulator against real Soar,
      # loop by loop, through Soar's Python SML (python3 and the suite's own SML module)
      - name: Check the behavior generator and simulator
        run: npm run test:behavior

      - name: Compile JKind and bundle a Java runtime
        run: npm run build:jkind -- --rebuild

      - name: Prove the FRC standard contracts
        run: npm run test:proofs

      - name: Build the app
        run: npx electron-vite build
